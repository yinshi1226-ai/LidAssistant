name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: 打 tag 自动发布
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - run: ./LidAssistant/build-app.sh

      - name: 压缩 + 校验和（文件名用 ASCII，避免上传被截断）
        run: |
          cd LidAssistant/build
          zip -r LidAssistant.zip 盒盖助手.app
          shasum -a 256 LidAssistant.zip > SHA256SUMS

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LidAssistant/build/LidAssistant.zip
            LidAssistant/build/SHA256SUMS
          generate_release_notes: true
