<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="1002" y="182" width="504" height="412" rx="24"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>
  <rect x="0" y="0" width="18" height="900" fill="#C2410C"/>

  <text x="84" y="78" fill="#EA580C" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="2">LIDASSISTANT · MANUAL MODE</text>
  <text x="84" y="145" fill="#0F172A" font-family="Helvetica Neue, Arial, sans-serif" font-size="43" font-weight="700">Choose lid-close sleep behavior directly</text>
  <text x="84" y="192" fill="#64748B" font-family="Helvetica Neue, Arial, sans-serif" font-size="22">Useful for downloads, renders, or long-running work outside the Auto list</text>

  <line x1="84" y1="236" x2="900" y2="236" stroke="#CBD5E1" stroke-width="2"/>

  <rect x="84" y="282" width="812" height="120" rx="18" fill="#FFF7ED" stroke="#FED7AA"/>
  <circle cx="128" cy="342" r="24" fill="#F97316"/>
  <text x="128" y="349" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700">ON</text>
  <text x="174" y="330" fill="#0F172A" font-family="Helvetica Neue, Arial, sans-serif" font-size="27" font-weight="700">Stay awake on lid close</text>
  <text x="174" y="368" fill="#475569" font-family="Helvetica Neue, Arial, sans-serif" font-size="19">Orange means the Mac keeps running; turn it off to restore lid-close sleep</text>

  <rect x="84" y="430" width="812" height="120" rx="18" fill="#EFF6FF" stroke="#BFDBFE"/>
  <circle cx="128" cy="490" r="24" fill="#0A84FF"/>
  <text x="128" y="497" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700">DIM</text>
  <text x="174" y="478" fill="#0F172A" font-family="Helvetica Neue, Arial, sans-serif" font-size="27" font-weight="700">Black-screen energy saver</text>
  <text x="174" y="516" fill="#475569" font-family="Helvetica Neue, Arial, sans-serif" font-size="19">Dims the built-in display while work continues, then restores brightness</text>

  <rect x="84" y="582" width="812" height="130" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="116" y="626" fill="#1E3A8A" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700">GOOD FOR TEMPORARY WORK</text>
  <text x="116" y="666" fill="#334155" font-family="Helvetica Neue, Arial, sans-serif" font-size="20">Large downloads · Local rendering · Batch jobs · Unsupported task sources</text>

  <rect x="84" y="742" width="812" height="66" rx="16" fill="#F1F5F9"/>
  <text x="116" y="783" fill="#334155" font-family="Helvetica Neue, Arial, sans-serif" font-size="18">Quitting the app restores normal sleep to reduce accidental battery drain</text>

  <rect x="956" y="126" width="584" height="548" rx="34" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="1002" y="182" width="504" height="412" rx="24" fill="#FFFFFF" filter="url(#shadow)"/>
  <image href="menu-manual.png" x="1002" y="182" width="504" height="412" preserveAspectRatio="xMidYMid meet" clip-path="url(#screenClip)"/>
  <circle cx="1214" cy="632" r="5" fill="#F97316"/>
  <text x="1230" y="639" fill="#64748B" font-family="Helvetica Neue, Arial, sans-serif" font-size="18">Manual mode</text>

  <text x="84" y="858" fill="#94A3B8" font-family="Helvetica Neue, Arial, sans-serif" font-size="16">LidAssistant · v1.7.0 · Apple silicon · macOS 13+</text>
</svg>
