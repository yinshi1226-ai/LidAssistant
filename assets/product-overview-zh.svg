<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="1032" y="154" width="452" height="600" rx="24"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>
  <rect x="0" y="0" width="18" height="900" fill="#1E3A8A"/>

  <text x="84" y="78" fill="#2563EB" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2">MACOS 菜单栏工具</text>
  <text x="84" y="145" fill="#0F172A" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif" font-size="48" font-weight="700">合盖之后任务继续，结束后自动休眠</text>
  <text x="84" y="192" fill="#64748B" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif" font-size="24">自动识别 AI 任务状态，也保留随时可控的手动模式</text>

  <line x1="84" y1="236" x2="896" y2="236" stroke="#CBD5E1" stroke-width="2"/>

  <circle cx="116" cy="310" r="28" fill="#1E3A8A"/>
  <text x="116" y="319" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue, Arial, sans-serif" font-size="25" font-weight="700">1</text>
  <text x="166" y="300" fill="#0F172A" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="700">识别任务状态</text>
  <text x="166" y="337" fill="#475569" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif" font-size="21">DeepSeek、ChatGPT、Claude、WorkBuddy 集中显示</text>

  <line x1="116" y1="346" x2="116" y2="422" stroke="#CBD5E1" stroke-width="3"/>
  <circle cx="116" cy="458" r="28" fill="#2563EB"/>
  <text x="116" y="467" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue, Arial, sans-serif" font-size="25" font-weight="700">2</text>
  <text x="166" y="448" fill="#0F172A" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="700">合盖继续运行</text>
  <text x="166" y="485" fill="#475569" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif" font-size="21">需要时阻止休眠，并可把屏幕亮度降到最低节能</text>

  <line x1="116" y1="494" x2="116" y2="570" stroke="#CBD5E1" stroke-width="3"/>
  <circle cx="116" cy="606" r="28" fill="#60A5FA"/>
  <text x="116" y="615" text-anchor="middle" fill="#0F172A" font-family="Helvetica Neue, Arial, sans-serif" font-size="25" font-weight="700">3</text>
  <text x="166" y="596" fill="#0F172A" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="700">空闲后按等待时间休眠</text>
  <text x="166" y="633" fill="#475569" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif" font-size="21">自动模式跟随任务；手动模式一键选择“合盖休眠 / 不眠”</text>

  <rect x="84" y="704" width="812" height="92" rx="18" fill="#F1F5F9"/>
  <text x="116" y="742" fill="#1E3A8A" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700">边界说明</text>
  <text x="116" y="774" fill="#334155" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif" font-size="19">本地运行 · 不读取任务正文 · 系统休眠权限可随时撤销</text>

  <rect x="976" y="112" width="560" height="694" rx="34" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="1032" y="154" width="452" height="600" rx="24" fill="#FFFFFF" filter="url(#shadow)"/>
  <image href="menu-auto.png" x="1032" y="154" width="452" height="600" preserveAspectRatio="xMidYMid meet" clip-path="url(#screenClip)"/>
  <rect x="1034" y="756" width="448" height="1" fill="#E2E8F0"/>
  <circle cx="1248" cy="781" r="5" fill="#2563EB"/>
  <text x="1264" y="788" fill="#64748B" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif" font-size="18">自动模式界面</text>

  <text x="84" y="858" fill="#94A3B8" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif" font-size="16">盒盖助手 · v1.7.0 · Apple silicon · macOS 13+</text>
</svg>
